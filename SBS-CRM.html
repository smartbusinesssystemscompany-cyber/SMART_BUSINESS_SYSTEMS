<style>
:root{--navy:#0B1F3A;--navy2:#112A4D;--gold:#C9A24A;--gold2:#E3C072;--ivory:#F6F4EE;--line:#E4DFD1;--ink:#0B1F3A;--mut:#5B6577;--bg:#F2F3F5;--card:#fff;
 --ok:#1F7A3E;--bad:#B42318;--warn:#8A5A00;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
body[dir=rtl]{font-family:Cairo,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 520px at 80% 10%,rgba(201,162,74,.2),transparent 60%),var(--navy)}
.acard{width:min(400px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(201,162,74,.35);border-radius:20px;padding:30px 26px;color:#fff;backdrop-filter:blur(10px)}
.acard h1{margin:14px 0 4px;font-size:22px}
.acard p{margin:0 0 18px;color:#B6C3D6;font-size:13px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:#A9B8CE;margin-bottom:5px}
.fld input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;outline:none}
.fld input:focus{border-color:var(--gold)}
.gbtn{width:100%;padding:12px;border-radius:10px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1E00;font-weight:800}
.alink{display:block;margin-top:12px;color:#C6CEDC;font-size:12.5px;text-align:center;text-decoration:underline}
.amsg{margin-top:12px;font-size:12.5px;color:#F3C6C0;min-height:18px}
/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.tr{display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:4px}
.brand small{display:block;font-size:8px;letter-spacing:2.4px;color:#9FB0C8;font-weight:700}
.sp{flex:1}
.lang{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
.lang button{padding:4px 11px;border-radius:999px;color:#C6CEDC;font-size:12px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--gold);color:#2A1E00}
.who{font-size:12px;color:#C6CEDC;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{height:32px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#E7EBF2;font-size:12.5px;font-weight:700}
.tabs{display:flex;gap:4px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:7px 14px;border-radius:999px;color:#C6CEDC;font-weight:600;white-space:nowrap}
.tabs button[aria-current=true]{background:#fff;color:var(--navy);font-weight:800}
main{max-width:1260px;margin:0 auto;padding:18px 16px 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:21px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.c2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(11,31,58,.05),0 8px 22px rgba(11,31,58,.06);padding:16px}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--mut)}
.kpi.dk{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi.dk .l,.kpi.dk .s{color:#9FB0C8}.kpi.dk .v{color:var(--gold2)}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sh h2{margin:0;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--mut);text-transform:uppercase}
.sh .ln{flex:1;height:1px;background:var(--line)}
.sec{margin-top:16px}
.bars .r{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bars .b{height:9px;border-radius:999px;background:#EEEAE0;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bars .n{text-align:end;font-weight:700}
.funnel .r{display:flex;align-items:center;gap:10px;margin:6px 0}
.funnel .f{height:30px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:12.5px;min-width:44px;transition:width .4s}
.funnel .f.g{background:var(--gold);color:#2A1E00}
.funnel .lb{font-size:12.5px;color:var(--mut);white-space:nowrap}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.inp,.sel{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none;font-size:13px}
.inp:focus,.sel:focus{border-color:var(--gold)}
.btn{padding:9px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.btn.g{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1E00}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--line)}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);background:#FBFAF7;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F0EEE7;font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FBFAF7}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.t-hot{background:#FBE4E1;color:#8C1D12}.t-warm{background:#FAEFD3;color:#6B4A07}.t-cold{background:#E7EAF0;color:#2A3B57}
.s-new{background:#E7EAF0;color:#2A3B57}.s-contacted{background:#E6EEFA;color:#1F4E8C}.s-qualified{background:#EDE6FA;color:#4B2C8C}
.s-proposal{background:#FAEFD3;color:#6B4A07}.s-won{background:#E3F3E8;color:#15632F}.s-lost{background:#F1F1F1;color:#555}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
/* drawer */
.dw{position:fixed;inset:0;z-index:40;background:rgba(5,14,30,.55);display:none}
.dw.on{display:block}
.dp{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:#fff;overflow:auto;padding:0 0 30px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.dh{position:sticky;top:0;background:var(--navy);color:#fff;padding:18px 20px;display:flex;gap:12px;align-items:flex-start}
.dh h3{margin:0;font-size:19px}
.dh p{margin:2px 0 0;color:#B6C3D6;font-size:13px}
.db{padding:16px 20px}
.dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.brief{background:var(--ivory);border-inline-start:3px solid var(--gold);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:13px}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:9px 0;border-bottom:1px solid #F0EEE7;font-size:13px}
.tl small{color:var(--mut);display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
.f2 .inp,.f2 .sel{width:100%}
textarea.inp{width:100%;min-height:70px;resize:vertical}
.toast{position:fixed;inset-inline-end:16px;bottom:16px;z-index:60;background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.banner{background:#FFF9EA;border:1px solid #F0DFAE;color:#6B4A07;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
@media(max-width:760px){
 .c2,.f2{grid-template-columns:1fr}
 .k4{grid-template-columns:1fr 1fr}
 .kpi .v{font-size:20px}
 .who{display:none}
 .bars .r{grid-template-columns:90px 1fr 34px}
 .dl{grid-template-columns:100px 1fr}
}

.atabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:12px;margin:18px 0 16px}
.atabs button{padding:9px;border-radius:9px;color:#C6CEDC;font-weight:700;font-size:13px}
.atabs button[aria-selected=true]{background:#fff;color:var(--navy)}
.amsg.ok{color:#9FE3BC}
.state{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 520px at 80% 10%,rgba(201,162,74,.2),transparent 60%),var(--navy);color:#fff;text-align:center}
.state .box{max-width:460px}
.state h1{font-size:26px;margin:18px 0 8px}
.state p{color:#B6C3D6;margin:0 0 18px;line-height:1.65}
.ring{width:92px;height:92px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:rgba(201,162,74,.14);border:1px solid rgba(201,162,74,.45);color:var(--gold2)}
.ring svg{width:46px;height:46px}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(201,162,74,.45)}50%{box-shadow:0 0 0 16px rgba(201,162,74,0)}}
.welcome{position:fixed;inset:0;z-index:70;background:rgba(5,14,30,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.wcard{width:min(520px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.45);animation:wpop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes wpop{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.whead{background:linear-gradient(135deg,var(--navy),#163058);color:#fff;padding:28px 28px 24px;position:relative;overflow:hidden}
.whead::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.35),transparent 66%)}
.whead h2{margin:14px 0 4px;font-size:24px;position:relative}
.whead p{margin:0;color:#B6C3D6;position:relative}
.wbody{padding:22px 28px 26px}
.wlist{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.wlist li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#3A4556}
.wlist b{color:var(--navy);display:block}
.wlist i{width:30px;height:30px;border-radius:9px;background:var(--ivory);display:grid;place-items:center;flex:none;font-style:normal;color:var(--gold);font-weight:800}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #F0EEE7;flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .mi{flex:1;min-width:180px}
.mrow .mi b{display:block}
.mrow .mi small{color:var(--mut)}
.mact{display:flex;gap:6px;flex-wrap:wrap}
.mact .btn{padding:7px 11px;font-size:12px}
.r-owner{background:#0B1F3A;color:#E3C072}.r-manager{background:#EDE6FA;color:#4B2C8C}.r-sales{background:#E6EEFA;color:#1F4E8C}.r-viewer{background:#F1F1F1;color:#555}
.st-pending{background:#FAEFD3;color:#6B4A07}.st-approved{background:#E3F3E8;color:#15632F}.st-suspended{background:#FBE4E1;color:#8C1D12}
.pend{border:1px solid #F0DFAE;background:#FFFCF2}
.myday li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ro .edit-only{display:none!important}
.pwgen{font-size:12px;color:var(--gold);font-weight:700;text-decoration:underline;margin-top:6px;display:inline-block}
.skl{height:12px;border-radius:8px;background:linear-gradient(90deg,#ECE9E1 0%,#F6F4EE 50%,#ECE9E1 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

.ahs{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:#E3C072}
.ahs svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 10px rgba(227,192,114,.45))}
.ahs svg path{fill:#E3C072;fill-opacity:0;stroke:#F3D58C;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:ahd 2s cubic-bezier(.6,.05,.25,1) .3s forwards,ahf .9s ease 2s forwards}
.ahs span{font-size:12.5px;font-weight:700;letter-spacing:.4px}
.ahs::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,74,.6),transparent)}
body[dir=rtl] .ahs::after{background:linear-gradient(270deg,rgba(201,162,74,.6),transparent)}
@keyframes ahd{to{stroke-dashoffset:0}}@keyframes ahf{to{fill-opacity:1;stroke-opacity:0}}
.ring svg{width:52px;height:52px}
.whead .ring svg{width:40px;height:40px}
</style>
</head>

function weekChart(rows){
 if(!rows.length)return `<div class="empty">${esc(t('noData'))}</div>`;
 const w=640,h=200,pl=34,pb=26,pt=12,iw=w-pl-12,ih=h-pt-pb,max=Math.max(...rows.map(r=>r.leads),1);
 const bw=Math.min(34,iw/rows.length-10);let s='';
 for(let i=0;i<=3;i++){const y=pt+ih-ih*i/3;s+=`<line x1="${pl}" x2="${w-12}" y1="${y}" y2="${y}" stroke="#ECE7DA"/><text x="${pl-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#8A8F99">${Math.round(max*i/3)}</text>`;}
 rows.forEach((r,i)=>{const cx=pl+iw*(i+.5)/rows.length,bh=ih*r.leads/max,wh=ih*r.won/max;
  s+=`<rect x="${cx-bw/2}" y="${pt+ih-bh}" width="${bw}" height="${bh}" rx="4" fill="#0B1F3A"/>`;
  if(r.won)s+=`<rect x="${cx-bw/2}" y="${pt+ih-wh}" width="${bw}" height="${wh}" rx="4" fill="#C9A24A"/>`;
  s+=`<text x="${cx}" y="${h-8}" font-size="10" text-anchor="middle" fill="#8A8F99">${new Date(r.week).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</text>`;});
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="weekly">${s}</svg>`;
}
function bars(rows,key,label){if(!rows.length)return `<div class="empty">—</div>`;const max=Math.max(...rows.map(r=>r.n),1);
 return `<div class="bars">${rows.map(r=>`<div class="r"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label(r[key]))}</span><span class="b"><i style="width:${(r.n/max*100).toFixed(0)}%"></i></span><span class="n">${r.n}</span></div>`).join('')}</div>`;}
function funnel(rows){const m=Object.fromEntries(rows.map(r=>[r.status,r.n]));const max=Math.max(...STAGES.map(s=>m[s]||0),1);
 return `<div class="funnel">${STAGES.map(s=>`<div class="r"><div class="f ${s==='won'?'g':''}" style="width:${Math.max(12,(m[s]||0)/max*78)}%">${m[s]||0}</div><span class="lb">${esc(t('st_'+s))}</span></div>`).join('')}</div>`;}

function genPw(){const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',s='!@#$%&*';const r=crypto.getRandomValues(new Uint32Array(12));
 let p='';for(let i=0;i<10;i++)p+=a[r[i]%a.length];return p+s[r[10]%s.length]+String(r[11]%10);}

const SECRET = '${secret}';

function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.secret !== SECRET) return out({ ok: false, error: 'forbidden' });
    const opts = { htmlBody: d.html, name: d.name || 'SBS Smart Business Systems' };
    if (d.replyTo) opts.replyTo = d.replyTo;
    GmailApp.sendEmail(d.to, d.subject, d.text || 'Thank you for contacting SBS.', opts);
    return out({ ok: true, left: MailApp.getRemainingDailyQuota() });
  } catch (err) {
    return out({ ok: false, error: String(err) });
  }
}
function doGet() { return out({ ok: true, service: 'SBS mail' }); }
function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function authorize() { GmailApp.getInboxUnreadCount(); MailApp.getRemainingDailyQuota(); }
`;}

 return `<div class="ph"><div><h1>${esc(t('profile'))}</h1></div></div>

function csv(){const cols=['created_at','name','company','email','phone','country','service','source','status','score','temperature','deal_value','next_follow_up'];
 const rows=[cols.concat(['assigned_to']).join(',')].concat(LEADS.map(l=>cols.map(c=>'"'+String(l[c]??'').replace(/"/g,'""')+'"').concat('"'+memberName(l.assigned_to)+'"').join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='sbs-clients.csv';a.click();}

document.addEventListener('click',async e=>{
 const lg=e.target.closest('[data-setlang]');if(lg){LANG=lg.dataset.setlang;applyLang();return;}
 const g=e.target.closest('[data-go]');if(g){VIEW=g.dataset.go;render();return;}
 const r=e.target.closest('[data-lead]');if(r){openLead(r.dataset.lead);return;}
 if(e.target.id==='dw')$('#dw').classList.remove('on');
 if(e.target.id==='newl')newLead();if(e.target.id==='csv')csv();
 if(e.target.id==='v_gen'){$('#v_p').value=genPw();return;}
 if(e.target.id==='v_go'){try{const r=await fn('invite',{name:$('#v_n').value,job_title:$('#v_t').value,email:$('#v_e').value,role:$('#v_r').value,password:$('#v_p').value});
   toast(t('saved'));render();}catch(err){toast(t('e_'+err.message)!=='e_'+err.message?t('e_'+err.message):t('e_generic'));}return;}
 const a=e.target.closest('[data-act]');if(a){const act=a.dataset.act,u=a.dataset.u;const body={user_id:u};
  if(act==='remove'&&!confirm(t('confirmRemove')))return;
  if(act==='reset_password'){const p=prompt(t('newPw'),genPw());if(!p)return;body.password=p;}
  if(act==='approve'){const s=document.getElementById('ar_'+u);if(s)body.role=s.value;}
  try{await fn(act,body);toast(t('saved'));if(act==='reset_password')prompt(t('tempPw'),body.password);render();}catch(err){toast(t('e_generic'));}return;}
 if(e.target.id==='p_go'){const {error}=await sb.rpc('owner_change_pin',{p_old:$('#p_old').value,p_new:$('#p_new').value});toast(error?(/wrong_pin/.test(error.message)?t('pinWrong'):error.message):t('pinChanged'));if(!error){$('#p_old').value='';$('#p_new').value='';}return;}
 const mt=e.target.closest('[data-mtab]');if(mt){document.querySelectorAll('[data-mtab]').forEach(x=>x.setAttribute('aria-selected',String(x===mt)));['gs','bv','gm'].forEach(k=>$('#mt_'+k).classList.toggle('hide',mt.dataset.mtab!==k));return;}
 if(e.target.id==='gs_copy'){const ta=$('#gs_code');try{await navigator.clipboard.writeText(ta.value);}catch(err){ta.select();document.execCommand('copy');}toast(t('gsCopied'));return;}
 if(e.target.id==='gs_go'){const b=e.target;b.disabled=true;try{await fn('set_gas',{url:$('#gs_url').value.trim(),mail_name:$('#gs_n').value});toast(t('gOk'));render();}catch(err){toast(t('gsFail'));}b.disabled=false;return;}
 if(e.target.id==='b_go'){const b=e.target;b.disabled=true;try{await fn('set_brevo',{api_key:$('#b_k').value,sender_email:$('#b_s').value,mail_name:$('#b_n').value});toast(t('gOk'));render();}catch(err){toast(t('bvFail'));}b.disabled=false;return;}
 if(e.target.id==='g_go'){const b=e.target;b.disabled=true;try{await fn('set_mail',{gmail_user:$('#g_u').value,gmail_app_password:$('#g_p').value,mail_name:$('#g_n').value});toast(t('gOk'));render();}catch(err){toast(t('gFail'));}b.disabled=false;return;}
 if(e.target.id==='g_test'){try{await fn('test_mail',{});toast(t('gOk'));}catch(err){toast(t('gFail'));}return;}
 if(e.target.id==='ssave'){const v=$('#sn').value.trim();const {error}=await sb.from('settings').upsert({key:'notify_email',value:v,updated_at:new Date().toISOString()});toast(error?error.message:t('saved'));}
 if(e.target.id==='ungo'){const v=$('#un').value.trim().toLowerCase();const {error}=await sb.rpc('set_my_username',{p_username:v});
  if(error){const k=(error.message.match(/username_(invalid|taken)/)||[])[0];toast(k?t('e_'+k):error.message);return;}ME.username=v;toast(t('saved'));return;}
 if(e.target.id==='npgo'){const p=$('#np').value;if(p.length<8){toast(t('e_password_short'));return;}const {error}=await sb.auth.updateUser({password:p});toast(error?error.message:t('pwChanged'));if(!error)$('#np').value='';}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='fst'){F.status=e.target.value;$('#lt').innerHTML=leadTable();}
 if(e.target.id==='ftp'){F.temp=e.target.value;$('#lt').innerHTML=leadTable();}
 if(e.target.id==='fwho'){F.who=e.target.value;$('#lt').innerHTML=leadTable();}
 if(e.target.dataset.role){try{await fn('set_role',{user_id:e.target.dataset.role,role:e.target.value});toast(t('saved'));}catch(err){toast(t('e_generic'));}}
});
document.addEventListener('input',e=>{if(e.target.id==='fs'){F.s=e.target.value;$('#lt').innerHTML=leadTable();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dw').classList.remove('on');});
try{const l=localStorage.getItem('sbs_crm_lang');if(l)LANG=l;}catch(e){}
applyLang();setAuthMode('in');
try{if(sessionStorage.getItem('sbs_idle')==='1'){sessionStorage.removeItem('sbs_idle');const m=$('#amsg');m.className='amsg';m.style.color='#E3C072';m.textContent=t('idleOut');}}catch(e){}
sb.auth.getSession().then(({data})=>{if(data.session)enter();});
