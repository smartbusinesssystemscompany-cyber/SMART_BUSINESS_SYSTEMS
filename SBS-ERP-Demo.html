<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="SBS · Smart Business Systems">
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 120%27%3E%3Crect width=%27120%27 height=%27120%27 rx=%2726%27 fill=%27%23C9A24A%27/%3E%3Cpath d=%27M20 88 L48 58 L66 76 L94 39 M76 34 H98 V56%27 fill=%27none%27 stroke=%27%230B1F3A%27 stroke-width=%2713%27/%3E%3C/svg%3E">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBS ERP — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#0B1F3A; --navy2:#112A4D; --navy3:#1A3A63; --gold:#C9A24A; --gold2:#E0BC68;
  --ivory:#F6F4EE; --line:#E2DDCF; --ink:#0B1F3A; --mut:#5A6475; --ok:#1F7A3E; --bad:#B42318; --warn:#9A6B00;
  --bg:#F2F3F5; --card:#FFFFFF; --shadow:0 1px 2px rgba(11,31,58,.06),0 8px 24px rgba(11,31,58,.07);
  --r:14px; --fs:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:var(--fs);line-height:1.5;-webkit-font-smoothing:antialiased}
body[dir=rtl]{font-family:Cairo,"Segoe UI",system-ui,sans-serif}
body[dir=rtl] .flip{transform:scaleX(-1)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 520px at 78% 12%,rgba(201,162,74,.20),transparent 60%),
    radial-gradient(700px 520px at 12% 88%,rgba(26,58,99,.75),transparent 60%),
    var(--navy);
  padding:24px}
.lgrid{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
.lcard{position:relative;width:min(400px,100%);background:rgba(255,255,255,.055);backdrop-filter:blur(14px);
  border:1px solid rgba(201,162,74,.35);border-radius:22px;padding:34px 30px 28px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lmark{width:68px;height:68px;margin:0 auto}
.lname{color:#fff;font-weight:800;font-size:30px;letter-spacing:9px;padding-inline-start:9px;margin-top:16px}
.lrule{width:140px;height:1px;background:var(--gold);margin:9px auto}
.lsub{color:#C6CEDC;font-size:9.5px;letter-spacing:4px;font-weight:700;font-family:Inter,sans-serif}
.ltitle{color:#fff;font-size:15px;font-weight:700;margin-top:22px}
.lhint{color:#9FB0C8;font-size:12px;margin-top:4px}
.lfield{margin-top:14px;text-align:start}
.lfield label{display:block;color:#C6CEDC;font-size:11px;font-weight:600;margin-bottom:5px}
.lfield input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#fff;outline:none}
.lfield input:focus{border-color:var(--gold)}
.lbtn{margin-top:18px;width:100%;padding:12px;border-radius:11px;background:linear-gradient(180deg,var(--gold2),var(--gold));
  color:#2A1E00;font-weight:800;letter-spacing:.4px;transition:transform .12s ease,filter .12s}
.lbtn:hover{filter:brightness(1.06)} .lbtn:active{transform:translateY(1px)}
.lnote{margin-top:14px;color:#8FA1BA;font-size:11px;line-height:1.5}
.llang{position:absolute;top:14px;inset-inline-end:14px;display:flex;gap:4px;background:rgba(255,255,255,.08);
  padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
.llang button{padding:5px 12px;border-radius:999px;color:#C6CEDC;font-size:11.5px;font-weight:700}
.llang button[aria-pressed=true]{background:var(--gold);color:#2A1E00}

/* ---------- shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.tb1{display:flex;align-items:center;gap:12px;padding:9px 16px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.bname{font-weight:800;letter-spacing:4px;font-size:15px;padding-inline-start:4px}
.bsub{font-size:8px;letter-spacing:2.4px;color:#9FB0C8;font-weight:700;font-family:Inter,sans-serif;white-space:nowrap}
.tbspacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 11px;font-size:11.5px;color:#D9DEE8;white-space:nowrap}
.chip.live b{color:#6EE7A8}
.dot{width:7px;height:7px;border-radius:50%;background:#43D787;box-shadow:0 0 0 3px rgba(67,215,135,.2)}
.lang{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.13)}
.lang button{padding:4px 11px;border-radius:999px;color:#C6CEDC;font-size:11.5px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--gold);color:#2A1E00}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);color:#D9DEE8}
.iconbtn:hover{background:rgba(255,255,255,.15)}
.nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;padding:7px 13px;border-radius:999px;color:#C6CEDC;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button[aria-current=true]{background:#fff;color:var(--navy);font-weight:700}
.main{flex:1;padding:18px 16px 40px;max-width:1240px;width:100%;margin:0 auto}

/* ---------- common ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:12px}
.sec{margin-top:20px}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sech h2{margin:0;font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--mut);text-transform:uppercase}
.sech .ln{flex:1;height:1px;background:var(--line)}
.kpi{padding:14px 15px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi .l{font-size:11px;color:var(--mut);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .d{font-size:11px;margin-top:3px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)} .down{color:var(--bad)}
.kpi.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.dark .l{color:#9FB0C8} .kpi.dark .v{color:var(--gold2)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);font-weight:700;
  padding:9px 12px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid #F0EEE7;font-size:13px;vertical-align:middle}
tbody tr:hover td{background:#FBFAF7}
.num{text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);max-height:62vh}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#E3F3E8;color:#15632F} .t-bad{background:#FBE4E1;color:#8C1D12}
.t-w{background:#FAEFD3;color:#6B4A07} .t-n{background:#E7EAF0;color:#2A3B57}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.inp,.sel{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none;font-size:13px}
.inp:focus,.sel:focus{border-color:var(--gold)}
.btn{padding:8px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.btn:hover{background:var(--navy3)}
.btn.g{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1E00}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.o:hover{background:var(--ivory)}
.muted{color:var(--mut)}
.small{font-size:12px}
.mcard{text-align:start;padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;transition:transform .12s ease,box-shadow .12s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(11,31,58,.07),0 14px 30px rgba(11,31,58,.1);border-color:#D7CEB2}
.mico{width:36px;height:36px;border-radius:10px;background:var(--ivory);display:grid;place-items:center;font-size:17px;flex:none}
.mt{display:block;font-weight:700;font-size:13.5px;line-height:1.25}
.md{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--navy3) 100%);color:#fff;
  border-radius:18px;padding:20px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,74,.28),transparent 68%)}
.hero h2{margin:0;font-size:20px;font-weight:800}
.hero p{margin:4px 0 0;color:#B9C6DA;font-size:13px}
.herorow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;position:relative}
.herostat{display:flex;gap:22px;flex-wrap:wrap}
.herostat div{min-width:86px}
.herostat .l{font-size:10.5px;color:#9FB0C8;letter-spacing:.4px}
.herostat .v{font-size:17px;font-weight:800;color:var(--gold2)}
.banner{display:flex;gap:10px;align-items:center;background:#FFF9EA;border:1px solid #F0DFAE;border-radius:12px;
  padding:9px 13px;font-size:12.5px;color:#6B4A07;margin-bottom:14px}
.spark{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}
.bar{height:7px;border-radius:999px;background:#EDEAE1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--gold)}
.fgrid{display:grid;gap:12px}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.f .inp,.f .sel{width:100%}
.toast{position:fixed;inset-inline-end:18px;bottom:18px;z-index:60;background:var(--navy);color:#fff;padding:11px 16px;
  border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:13px;display:flex;gap:9px;align-items:center;
  transform:translateY(16px);opacity:0;transition:all .22s ease;pointer-events:none}
.toast.on{transform:none;opacity:1}
.foot{text-align:center;color:var(--mut);font-size:11.5px;padding:22px 0 6px}
@media(max-width:720px){
  .main{padding:14px 12px 34px}
  .ph h1{font-size:18px}
  .bsub{display:none}
  .hero{padding:16px}
}

@media(max-width:720px){
  .tb1{gap:7px;padding:8px 12px}
  .tb1 .chip{display:none}
  .lang button{padding:4px 10px}
  .grid[style*="1.55fr"],.grid[style*="1.5fr"],.grid[style*="1.3fr"],.grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .grid[style*="auto-fit,minmax(1"]{grid-template-columns:1fr 1fr!important;gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:18px}
  .kpi .d{font-size:10.5px}
  td,th{white-space:nowrap}
  td{font-size:12.5px;padding:9px 10px}
  .tw{max-height:none}
  .hero{border-radius:16px}
  .hero h2{font-size:18px}
  .herostat{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .herostat .v{font-size:16px}
  .ph h1{font-size:19px}
  .ph p{font-size:12.5px}
  .toolbar .inp{flex:1 1 100%}
  .toolbar .sel{flex:1 1 calc(50% - 4px)}
  .mcard{padding:12px}
  .nav button{font-size:12.5px;padding:7px 11px}
  .lcard{padding:28px 22px 22px}
}

.dhs{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 2px;color:#E3C072}
.dhs svg{width:40px;height:40px;filter:drop-shadow(0 0 10px rgba(227,192,114,.45))}
.dhs svg path{fill:#E3C072;fill-opacity:0;stroke:#F3D58C;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:dhd 2s cubic-bezier(.6,.05,.25,1) .3s forwards,dhf .9s ease 2s forwards}
.dhs span{font-size:12px;font-weight:700;letter-spacing:.4px}
@keyframes dhd{to{stroke-dashoffset:0}}@keyframes dhf{to{fill-opacity:1;stroke-opacity:0}}
</style>
</head>

function barChart(data, opt = {}) {
  const w = 680, h = opt.h || 190, pl = 46, pr = 10, pt = 12, pb = 24;
  const max = Math.max(...data.flatMap(d => d.v)) * 1.12 || 1;
  const iw = w - pl - pr, ih = h - pt - pb;
  const gw = iw / data.length, series = data[0].v.length;
  const bw = Math.min(16, (gw - 8) / series);
  const cols = opt.colors || [css('--navy'), css('--gold')];
  let s = '';
  for (let i = 0; i <= 4; i++) {
    const y = pt + ih - (ih * i / 4);
    s += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" stroke="${css('--line')}" stroke-width="1"/>`;
    s += `<text x="${pl - 7}" y="${y + 3.5}" text-anchor="end" font-size="9.5" fill="${css('--mut')}">${opt.fmt ? opt.fmt(max * i / 4) : num(max * i / 4)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2;
    d.v.forEach((v, k) => {
      const bh = Math.max(1, (v / max) * ih);
      const x = cx - (series * bw + (series - 1) * 3) / 2 + k * (bw + 3);
      s += `<rect x="${x.toFixed(1)}" y="${(pt + ih - bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="2.5" fill="${cols[k]}"><title>${esc(d.l)} ${num(v)}</title></rect>`;
    });
    s += `<text x="${cx}" y="${h - 7}" text-anchor="middle" font-size="9.5" fill="${css('--mut')}">${esc(d.l)}</text>`;
  });
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(opt.alt || 'chart')}">${s}</svg>`;
}
function lineChart(vals, labels, opt = {}) {
  const w = 680, h = opt.h || 180, pl = 46, pr = 12, pt = 14, pb = 24;
  const max = Math.max(...vals) * 1.12 || 1, min = opt.zero === false ? Math.min(...vals) * .88 : 0;
  const iw = w - pl - pr, ih = h - pt - pb;
  const X = i => pl + (iw * i / (vals.length - 1));
  const Y = v => pt + ih - ih * ((v - min) / (max - min));
  let s = '';
  for (let i = 0; i <= 4; i++) {
    const y = pt + ih - (ih * i / 4);
    s += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" stroke="${css('--line')}"/>`;
    s += `<text x="${pl - 7}" y="${y + 3.5}" text-anchor="end" font-size="9.5" fill="${css('--mut')}">${opt.fmt ? opt.fmt(min + (max - min) * i / 4) : num(min + (max - min) * i / 4)}</text>`;
  }
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  s += `<polygon points="${pl},${pt + ih} ${pts} ${w - pr},${pt + ih}" fill="${css('--gold')}" fill-opacity=".12"/>`;
  s += `<polyline points="${pts}" fill="none" stroke="${css('--gold')}" stroke-width="2.6" stroke-linejoin="round"/>`;
  vals.forEach((v, i) => { s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" fill="${css('--card')}" stroke="${css('--gold')}" stroke-width="2"><title>${esc(labels[i])} ${num(v)}</title></circle>`; });
  labels.forEach((l, i) => { if (i % Math.ceil(labels.length / 12) === 0) s += `<text x="${X(i).toFixed(1)}" y="${h - 7}" text-anchor="middle" font-size="9.5" fill="${css('--mut')}">${esc(l)}</text>`; });
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(opt.alt || 'trend')}">${s}</svg>`;
}

  parts.forEach((p, i) => {
    const len = C * p.p / 100;
    s += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${cols[i % cols.length]}" stroke-width="18"
      stroke-dasharray="${len.toFixed(1)} ${(C - len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 70 70)"><title>${esc(p.l)} ${p.p}%</title></circle>`;
    off += len;
  });
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="cost split">${s}</svg>`;
}

      <div style="width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-weight:800">${esc(L([e.en, e.ar]).slice(0, 1))}</div>
      <div style="min-width:0"><div style="font-weight:700">${esc(L([e.en, e.ar]))}</div>
        <div class="small muted">${esc(L(e.role))}</div></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:11px;font-size:12px">
        <span class="muted">${esc(t('site'))}</span><b>${esc(siteName(e.site))}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span class="muted">${esc(t('employee'))}</span><b>${e.id}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span class="muted">${esc(t('net'))}</span><b>${money(e.net)}</b></div></div>`).join('')}</div>`;
}


function vDocs() {
  const tag = d => d.days < 0 ? ['t-bad', t('expired')] : d.days <= 30 ? ['t-w', t('soon')] : ['t-ok', t('valid')];
  return ph('m_docs', 'd_docs', `<span class="chip" style="background:#FAEFD3;color:#6B4A07;border-color:#EBD9A8">${alertsDocs()} ${esc(t('alertDocs'))}</span>`) +
    `<div class="tw"><table><thead><tr><th>${esc(t('employee'))}</th><th>${esc(t('site'))}</th>
      <th>${esc(t('document'))}</th><th>${esc(t('expires'))}</th><th class="num">${esc(t('daysLeft'))}</th><th>${esc(t('status'))}</th></tr></thead>
      <tbody>${DOCROWS.map(d => { const g = tag(d); return `<tr>
        <td><b>${esc(L([d.emp.en, d.emp.ar]))}</b></td><td>${esc(siteName(d.emp.site))}</td>
        <td>${esc(L(d.doc))}</td><td>${d.exp}</td>
        <td class="num" style="font-weight:700">${d.days}</td><td><span class="tag ${g[0]}">${esc(g[1])}</span></td></tr>`; }).join('')}</tbody></table></div>`;
}


function vLeave() {
  const rows = EMP.map(e => ({ e, ent: 30, taken: int(0, 26), req: pick([['Annual', 'سنوية'], ['Sick', 'مرضية'], ['Unpaid', 'بدون راتب'], ['—', '—']]) }));
  return ph('m_leave', 'd_leave') + `<div class="tw"><table><thead><tr>
    <th>${esc(t('employee'))}</th><th>${esc(t('site'))}</th><th class="num">${esc(t('total'))}</th>
    <th class="num">${LANG === 'ar' ? 'المستخدم' : 'Taken'}</th><th class="num">${esc(t('balance'))}</th><th>${esc(t('type'))}</th><th style="width:140px"></th></tr></thead>
    <tbody>${rows.map(r => `<tr><td><b>${esc(L([r.e.en, r.e.ar]))}</b></td><td>${esc(siteName(r.e.site))}</td>
      <td class="num">${r.ent}</td><td class="num">${r.taken}</td>
      <td class="num" style="font-weight:800">${r.ent - r.taken}</td><td>${esc(L(r.req))}</td>
      <td><div class="bar"><i style="width:${(r.taken / r.ent * 100).toFixed(0)}%"></i></div></td></tr>`).join('')}</tbody></table></div>`;
}


function vStock(food) {
  const list = food ? STOCK.slice(7) : STOCK.slice(0, 8);
  const val = list.reduce((a, s) => a + s.qty * s.price, 0);
  return ph(food ? 'm_food' : 'm_stock', food ? 'd_food' : 'd_stock',
    `<span class="chip" style="background:var(--navy);color:#fff;border-color:var(--navy)">${esc(t('value'))}: ${money(val)}</span>`) +
    `<div class="tw"><table><thead><tr><th>${esc(t('item'))}</th><th>${esc(t('site'))}</th>
      <th class="num">${esc(t('qty'))}</th><th>${esc(t('unit'))}</th><th class="num">${esc(t('reorder'))}</th>
      <th class="num">${esc(t('value'))}</th><th>${esc(t('status'))}</th></tr></thead>
      <tbody>${list.map(s => `<tr><td><b>${esc(L([s.en, s.ar]))}</b></td><td>${esc(siteName(s.site))}</td>
        <td class="num" style="font-weight:700">${s.qty}</td><td>${esc(L([s.ue, s.ua]))}</td>
        <td class="num">${s.ro}</td><td class="num">${num(s.qty * s.price)}</td>
        <td><span class="tag ${s.qty < s.ro ? 't-bad' : 't-ok'}">${esc(s.qty < s.ro ? t('low') : t('okTag'))}</span></td></tr>`).join('')}</tbody></table></div>`;
}


function vSites() {
  const tot = MOVE.reduce((a, m) => a + m.cost, 0);
  return ph('m_sites', 'd_sites', `<span class="chip" style="background:var(--navy);color:#fff;border-color:var(--navy)">${esc(t('total'))}: ${money(tot)}</span>`) +
    `<div class="tw"><table><thead><tr><th>${esc(t('date'))}</th><th>${esc(t('from'))}</th><th>${esc(t('to'))}</th>
      <th>${esc(t('movedBy'))}</th><th class="num">${esc(t('people'))}</th><th class="num">${esc(t('tripCost'))}</th></tr></thead>
      <tbody>${MOVE.map(m => `<tr><td>${m.d}</td><td>${esc(siteName(m.from))}</td>
        <td><span class="flip" style="display:inline-block;color:var(--gold)">→</span> ${esc(siteName(m.to))}</td>
        <td>${esc(L(m.by))}</td><td class="num">${m.ppl}</td><td class="num" style="font-weight:700">${num(m.cost)}</td></tr>`).join('')}</tbody></table></div>`;
}


function vConsol() {
  const rows = SITES.map((s, i) => ({
    s: s.id, closed: i < 3,
    inn: int(4, 42) * 1000, out: int(3, 36) * 1000, hc: Math.round(EMP.filter(e => e.site === s.id).length),
  }));
  const T2 = rows.reduce((a, r) => ({ inn: a.inn + r.inn, out: a.out + r.out, hc: a.hc + r.hc }), { inn: 0, out: 0, hc: 0 });
  return ph('m_consol', 'd_consol') +
    `<div class="banner">◆ ${esc(t('consolNote'))}</div>
    <div class="tw"><table><thead><tr><th>${esc(t('site'))}</th><th>${esc(t('status'))}</th>
      <th class="num">${esc(t('cashIn'))}</th><th class="num">${esc(t('cashOut'))}</th><th class="num">${esc(t('headcount'))}</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><b>${esc(siteName(r.s))}</b></td>
        <td><span class="tag ${r.closed ? 't-ok' : 't-w'}">${esc(r.closed ? t('closed') : t('openSt'))}</span></td>
        <td class="num" style="color:${css('--ok')}">+${num(r.inn)}</td>
        <td class="num" style="color:${css('--bad')}">−${num(r.out)}</td><td class="num">${r.hc}</td></tr>`).join('')}
      <tr style="background:var(--ivory)"><td><b>${esc(t('total'))}</b></td><td></td>
        <td class="num"><b>+${num(T2.inn)}</b></td><td class="num"><b>−${num(T2.out)}</b></td><td class="num"><b>${T2.hc}</b></td></tr>
      </tbody></table></div>`;
}


const CUSTOMERS = [
  ['Northline Trading', 'نورث لاين للتجارة'], ['Delta Marine Services', 'دلتا للخدمات البحرية'],
  ['Horizon Contracting', 'هورايزن للمقاولات'], ['Blue Harbour Logistics', 'الميناء الأزرق للخدمات اللوجستية'],
];
const INVOICES = [];
for (let i = 0; i < 14; i++) {
  const iss = addD(today, -int(2, 120));
  const dueD = addD(iss, 30);
  const amt = int(14, 260) * 100;
  const st = dueD < today ? (rnd() > 0.55 ? 'paid' : 'overdue') : (rnd() > 0.5 ? 'paid' : 'unpaid');
  INVOICES.push({ no: 'INV-' + (9100 + i), cust: CUSTOMERS[i % 4], iss: fmtD(iss), due: fmtD(dueD), amt, st });
}
INVOICES.sort((a, b) => b.iss.localeCompare(a.iss));
function vPortal() {
  const outst = INVOICES.filter(i => i.st !== 'paid').reduce((a, i) => a + i.amt, 0);
  const over = INVOICES.filter(i => i.st === 'overdue').reduce((a, i) => a + i.amt, 0);
  const paid = INVOICES.filter(i => i.st === 'paid').reduce((a, i) => a + i.amt, 0);
  const k = (l, v, cls) => `<div class="kpi ${cls || ''}"><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`;
  const tag = s => `<span class="tag ${s === 'paid' ? 't-ok' : s === 'overdue' ? 't-bad' : 't-w'}">${esc(t(s))}</span>`;
  return ph('m_portal', 'd_portal') +
    `<div class="banner">◆ ${esc(t('portalNote'))}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(176px,1fr))">
      ${k(t('outstanding'), money(outst), 'dark')}
      ${k(t('overdue'), money(over))}
      ${k(t('paid'), money(paid))}
      ${k(t('customer'), CUSTOMERS.length)}</div>
    <div class="sec tw"><table><thead><tr>
      <th>${esc(t('invoice'))}</th><th>${esc(t('customer'))}</th><th>${esc(t('issued'))}</th>
      <th>${esc(t('due'))}</th><th class="num">${esc(t('amount'))}</th><th>${esc(t('status'))}</th><th></th></tr></thead>
      <tbody>${INVOICES.map(v => `<tr>
        <td style="font-variant-numeric:tabular-nums"><b>${v.no}</b></td>
        <td>${esc(L(v.cust))}</td><td>${v.iss}</td><td>${v.due}</td>
        <td class="num" style="font-weight:700">${num(v.amt)}</td><td>${tag(v.st)}</td>
        <td>${v.st === 'paid' ? `<span class="small muted">${esc(t('statement'))}</span>`
          : `<button class="btn g" data-pay="${v.no}" style="padding:5px 12px;font-size:12px">${esc(t('payNow'))}</button>`}</td></tr>`).join('')}</tbody></table></div>`;
}


function vSet() {
  const perms = [[USER, 'fullAccess'], [L(NAMES[2]), 'viewOnly'], [L(NAMES[0]), 'siteOnly'], [L(NAMES[4]), 'siteOnly']];
  return ph('m_set', 'd_set') + `<div class="banner">◆ ${esc(t('settingsNote'))}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card pad"><div class="sech"><h2>${esc(t('users'))}</h2><div class="ln"></div></div>
        ${perms.map(p => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">
          <span>${esc(p[0])}</span><span class="tag ${p[1] === 'fullAccess' ? 't-ok' : 't-n'}">${esc(t(p[1]))}</span></div>`).join('')}</div>
      <div class="card pad"><div class="sech"><h2>${esc(t('site'))}</h2><div class="ln"></div></div>
        ${SITES.map(s => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
          <span>${esc(siteName(s.id))}</span><span class="small muted">${s.id}</span></div>`).join('')}</div></div>`;
}


const VIEWS = {
  home: vHome, brief: vBrief, newv: vNewV, log: vLog, treasury: vTreasury, cashflow: vCashflow,
  payroll: vPayroll, accounts: vAccounts, fin: vFin, emp: vEmp, docs: vDocs, leave: vLeave,
  stock: () => vStock(false), food: () => vStock(true), sites: vSites, consol: vConsol, portal: vPortal, set: vSet,
};
let USER = 'Demo User';
function render() {
  renderNav();
  $('#view').innerHTML = (VIEWS[VIEW] || vHome)();
  if (VIEW !== 'home') $('#view').insertAdjacentHTML('beforeend',
    `<div style="margin-top:18px"><button class="btn o" data-go="home">← ${esc(t('backHome'))}</button></div>`);
}

function applyLang() {
  document.body.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-setlang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setlang === LANG)));
  if (!$('#app').classList.contains('hide')) render();
  try { localStorage.setItem('sbs_demo_lang', LANG); } catch (e) { }
}
function clock() {
  const el = $('#clock'); if (!el) return;
  const d = new Date();
  el.textContent = d.toLocaleDateString(LANG === 'ar' ? 'ar-EG' : 'en-GB', { weekday: 'short', day: '2-digit', month: 'short' })
    + ' · ' + d.toLocaleTimeString(LANG === 'ar' ? 'ar-EG' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
}
function enter() {
  USER = ($('#luser').value || 'Demo User').trim();
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  render(); clock();
  try { localStorage.setItem('sbs_demo_user', USER); } catch (e) { }
}

document.addEventListener('click', e => {
  const lg = e.target.closest('[data-setlang]');
  if (lg) { LANG = lg.dataset.setlang; applyLang(); if (!$('#app').classList.contains('hide')) toast(t('langSwitched')); clock(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  if (e.target.closest('#lgo')) { enter(); return; }
  if (e.target.closest('#outbtn')) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); VIEW = 'home'; return; }
  const pay = e.target.closest('[data-pay]');
  if (pay) { toast(t('payGateway')); return; }
  if (e.target.closest('#q_reset')) { LOGQ = { s: '', site: '', type: '', st: '' }; render(); return; }
  if (e.target.closest('#q_exp')) { toast(LANG === 'ar' ? 'يُصدَّر إلى Excel في النظام الفعلي' : 'Exports to Excel in the live system'); return; }
  if (e.target.closest('#savev')) {
    const amt = parseFloat($('#f_a').value) || 0;
    VOUCH.unshift({
      sn: $('#f_sn').value, d: $('#f_d').value, type: $('#f_t').value, site: $('#f_s').value,
      desc: [$('#f_desc').value || VDESC[0][0], $('#f_desc').value || VDESC[0][1]],
      payee: [$('#f_p').value || NAMES[0][0], $('#f_p').value || NAMES[0][1]],
      amt, st: 'pending',
    });
    toast(t('saved')); go('log'); return;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q_s') { LOGQ.s = e.target.value; const v = e.target.selectionStart; render(); const n = $('#q_s'); if (n) { n.focus(); n.setSelectionRange(v, v); } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'q_site') { LOGQ.site = e.target.value; render(); }
  if (e.target.id === 'q_type') { LOGQ.type = e.target.value; render(); }
  if (e.target.id === 'q_st') { LOGQ.st = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('#login').classList.contains('hide')) enter();
});


try {
  const sl = localStorage.getItem('sbs_demo_lang'); if (sl) LANG = sl;
  const su = localStorage.getItem('sbs_demo_user'); if (su) { USER = su; }
} catch (e) { }
$('#lmark').innerHTML = MARK(68, '#C9A24A');
$('#tbmark').innerHTML = MARK(26, '#C9A24A');
if (USER && USER !== 'Demo User') $('#luser').value = USER;
applyLang();
setInterval(clock, 20000);
</script>
</body></html>
